<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 390" role="img" aria-labelledby="title desc">
<title id="title">Ember — mod-kit</title><desc id="desc">A crooked panel piece does not fit the slot in the app window: it is too wide and its buttons touch. Ember measures it with a ruler, and the piece seats in the slot with its buttons spaced and a round meter. Closing line: It fits. Light and dark. At the end, a stamp presses the mod-kit seal onto the answer. Illustrative animation, not benchmark timing.</desc>
